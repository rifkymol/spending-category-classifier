name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-runtime.lock
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -c backend/requirements-runtime.lock
      - name: Run tests
        run: python -m pytest backend/tests -q -p no:cacheprovider

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run check:storage
      - run: npm run check:csp
      - run: npm run lint
      # next build generates next-env.d.ts (gitignored), which tsc needs for
      # the CSS side-effect import, so type-check after the build.
      - run: npm run build
      - run: npx tsc --noEmit -p .

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
